<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CMS Admin | Suresha Lakshmaiah</title>
  <link rel="stylesheet" href="/src/style.css">
  <style>
    body { background: #f4f4f4; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif;}
    .admin-card { background: white; padding: 3rem; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
    .admin-card h2 { font-size: 1.8rem; margin-bottom: 1rem; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #111;}
    input, textarea, select { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
    textarea { height: 180px; font-family: monospace; font-size: 0.9rem;}
    button { width: 100%; padding: 1rem; background: #dd1818; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase;}
    button:hover { background: #b01313; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<!-- Login container -->
<div class="admin-card" id="login-container">
  <h2>SureshaLakshmaiah CMS Login</h2>
  <p style="margin-bottom: 2rem; color: #666;">Authenticate to access the publishing dashboard.</p>
  <form id="login-form">
    <div class="form-group"><label>Username</label><input type="text" id="username" required></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
    <button type="submit">Log In</button>
  </form>
</div>

<!-- Dashboard container -->
<div class="admin-card hidden" id="dashboard-container" style="max-width: 800px; margin: 4rem 0;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
    <h2 id="form-title" style="margin-bottom: 0;">Publish New Insight</h2>
    <button type="button" id="cancel-edit-btn" class="hidden" style="width: auto; background: #666; padding: 0.5rem 1rem;">Cancel Edit</button>
  </div>
  <p style="margin-bottom: 2rem; color: #666;">This portal automatically generates secure HTML files and updates the homepage.</p>
  <form id="post-form">
    <div class="form-group"><label>Article Title</label><input type="text" id="title" required></div>
    <div class="form-group"><label>Category Tag</label><input type="text" id="tag" placeholder="e.g. STRATEGY" required></div>
    <div class="form-group">
      <label>Cover Image</label>
      <input type="file" id="heroImage" accept="image/*">
      <small id="image-help" style="color: #666;">Required for new posts. Leave empty when editing to keep existing image.</small>
    </div>
    <div class="form-group"><label>Content (HTML Formatting)</label>
      <textarea id="content" placeholder="<p>Write your beautiful content here...</p>&#10;<h2>Sub Header</h2>" required></textarea>
    </div>
    <button type="submit" id="post-btn">Publish to Live Site</button>
    <button type="button" id="logout-btn" style="background: #333; margin-top: 1rem;">Secure Logout</button>
  </form>

  <hr style="margin: 3rem 0; border: 0; border-top: 1px solid #eee;">
  <h2>Manage Published Posts</h2>
  <div id="posts-list" style="display: flex; flex-direction: column; gap: 1rem;">
    <p style="color: #666;">Loading posts...</p>
  </div>
</div>

<script>
  let token = localStorage.getItem('cms_token');
  let currentEditSlug = null;
  let currentEditImagePath = null;

  if (token) {
    document.getElementById('login-container').classList.add('hidden');
    document.getElementById('dashboard-container').classList.remove('hidden');
    loadPosts();
  }

  async function loadPosts() {
    try {
      const res = await fetch('/api/posts', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      const list = document.getElementById('posts-list');
      list.innerHTML = '';
      if (data.success && data.posts) {
        if(data.posts.length === 0) {
          list.innerHTML = '<p style="color: #666;">No posts found.</p>';
        }
        data.posts.forEach(post => {
          const div = document.createElement('div');
          div.style = "display: flex; justify-content: space-between; align-items: center; padding: 1rem; border: 1px solid #eee; border-radius: 4px; background: #fafafa;";
          div.innerHTML = `
            <div>
              <div style="font-weight: 600; color: #111;">${post.title}</div>
              <div style="font-size: 0.85rem; color: #666; margin-top: 0.25rem;">Slug: ${post.slug} | Tag: ${post.tag}</div>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button type="button" style="width: auto; padding: 0.5rem 1rem; font-size: 0.85rem;" onclick="editPost('${post.slug}')">Edit</button>
              <button type="button" style="width: auto; padding: 0.5rem 1rem; font-size: 0.85rem; background: #333;" onclick="deletePost('${post.slug}')">Delete</button>
            </div>
          `;
          list.appendChild(div);
        });
      } else {
        list.innerHTML = '<p style="color: red;">Failed to load posts.</p>';
      }
    } catch(err) {
      console.error(err);
    }
  }

  window.editPost = async (slug) => {
    try {
      const res = await fetch('/api/posts/' + slug, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (data.success && data.post) {
        const post = data.post;
        document.getElementById('title').value = post.title;
        document.getElementById('tag').value = post.tag;
        document.getElementById('content').value = post.content;
        
        currentEditSlug = post.slug;
        currentEditImagePath = post.imagePath;
        
        document.getElementById('form-title').innerText = "Edit Insight: " + post.title;
        document.getElementById('post-btn').innerText = "Update Published Post";
        document.getElementById('cancel-edit-btn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        alert('Could not fetch post details.');
      }
    } catch(err) {
      console.error(err);
      alert('Error fetching post details.');
    }
  };

  window.deletePost = async (slug) => {
    if (!confirm('Are you sure you want to permanently delete this post? This action cannot be undone.')) {
      return;
    }
    
    try {
      const res = await fetch('/api/posts/' + slug, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (data.success) {
        alert('Post deleted successfully.');
        if (currentEditSlug === slug) {
          document.getElementById('cancel-edit-btn').click();
        }
        loadPosts();
      } else {
        alert('Error deleting post: ' + data.error);
      }
    } catch(err) {
      console.error(err);
      alert('Failed to connect to backend server.');
    }
  };

  document.getElementById('cancel-edit-btn').addEventListener('click', () => {
    currentEditSlug = null;
    currentEditImagePath = null;
    document.getElementById('post-form').reset();
    document.getElementById('form-title').innerText = "Publish New Insight";
    document.getElementById('post-btn').innerText = "Publish to Live Site";
    document.getElementById('cancel-edit-btn').classList.add('hidden');
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    
    try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('cms_token', data.token);
          token = data.token;
          document.getElementById('login-container').classList.add('hidden');
          document.getElementById('dashboard-container').classList.remove('hidden');
          loadPosts();
        } else {
          alert('Invalid login credentials! Access denied.');
        }
    } catch(err) {
        alert("Failed to connect to backend! Is 'npm run dev' running?");
    }
  });

  document.getElementById('post-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const fileInput = document.getElementById('heroImage');
    if (!currentEditSlug && (!fileInput.files || fileInput.files.length === 0)) {
        alert("A cover image is required for a new post.");
        return;
    }

    const btn = document.getElementById('post-btn');
    const originalText = btn.textContent;
    btn.textContent = currentEditSlug ? "Updating..." : "Publishing...";
    btn.disabled = true;

    const fd = new FormData();
    fd.append('title', document.getElementById('title').value);
    fd.append('tag', document.getElementById('tag').value);
    fd.append('content', document.getElementById('content').value);
    if (fileInput.files[0]) {
        fd.append('heroImage', fileInput.files[0]);
    }
    if (currentEditSlug) {
        fd.append('existingImagePath', currentEditImagePath || '');
    }

    const url = currentEditSlug ? '/api/posts/' + currentEditSlug : '/api/publish';
    const method = currentEditSlug ? 'PUT' : 'POST';

    try {
      const res = await fetch(url, {
        method: method,
        headers: { 'Authorization': 'Bearer ' + token },
        body: fd
      });
      const data = await res.json();
      if (data.success) {
        alert(currentEditSlug ? 'Successfully updated!' : 'Successfully published!');
        window.location.href = '/blog/' + data.slug;
      } else {
        alert('Server Error: ' + data.error);
        if(data.error === "Unauthorized") {
            localStorage.removeItem('cms_token');
            location.reload();
        }
        btn.textContent = originalText;
        btn.disabled = false;
      }
    } catch(e) {
      alert('Failed to connect to backend server. Make sure node server.js is running alongside Vite.');
      btn.textContent = originalText;
      btn.disabled = false;
    }
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('cms_token');
    alert('Logged out successfully.');
    location.reload();
  });
</script>
</body>
</html>
